[package]
name = "chrono-ring"
version = "1.0.1"
description = "ChronoRing, a reminder app that rings at the time you choose"
authors = ["Vertive Foundation"]
edition = "2024"

[lib]
name = "chrono_ring_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
rodio = "0.20"
rusqlite = { version = "0.32", features = ["bundled"] }
tauri-plugin-autostart = "2"

# Only compiled on Windows. Used to ask whether notifications are allowed right now.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_UI_Shell"] }
