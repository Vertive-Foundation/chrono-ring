<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChronoRing</title>
    <!-- Applies the saved theme before the page paints, so there is no flash -->
    <script>
      document.documentElement.dataset.theme = localStorage.getItem("chronoring-theme") || "system";
    </script>
    <link rel="stylesheet" href="styles.css" />
    <script src="main.js" defer></script>
  </head>
  <body>
    <!-- Custom title bar. data-tauri-drag-region lets the bar move the window;
         buttons don't have it, so they still click normally. -->
    <header class="topbar" data-tauri-drag-region>
      <div class="brand" data-tauri-drag-region>
        <img class="logo" src="logo.svg" alt="" data-tauri-drag-region />
        <h1 data-tauri-drag-region>ChronoRing</h1>
      </div>

      <div class="topbar-right">
        <div class="theme-switch" role="group" aria-label="Theme">
          <button type="button" data-theme-choice="system" aria-pressed="true">System</button>
          <button type="button" data-theme-choice="light" aria-pressed="false">Light</button>
          <button type="button" data-theme-choice="dark" aria-pressed="false">Dark</button>
        </div>

        <div class="win-controls">
          <button id="win-min" class="win-btn" type="button" aria-label="Minimize" title="Minimize">
            <svg viewBox="0 0 10 10" aria-hidden="true"><path d="M0 5h10" /></svg>
          </button>
          <button id="win-max" class="win-btn" type="button" aria-label="Maximize" title="Maximize" data-maximized="false">
            <svg class="icon-max" viewBox="0 0 10 10" aria-hidden="true"><rect x="0.5" y="0.5" width="9" height="9" /></svg>
            <svg class="icon-restore" viewBox="0 0 10 10" aria-hidden="true"><path d="M2.5 0.5h7v7M0.5 2.5h7v7h-7z" /></svg>
          </button>
          <button id="win-close" class="win-btn win-close" type="button" aria-label="Close" title="Close">
            <svg viewBox="0 0 10 10" aria-hidden="true"><path d="M0 0L10 10M10 0L0 10" /></svg>
          </button>
        </div>
      </div>
    </header>

    <main>
      <p id="load-error" class="error-banner" hidden></p>

      <section id="upcoming-section" hidden>
        <h2>Upcoming</h2>
        <ul id="upcoming" class="cards"></ul>
      </section>

      <section id="past-section" hidden>
        <h2>Finished</h2>
        <ul id="past" class="cards"></ul>
      </section>

      <section id="empty-state" class="empty-card" hidden>
        <img class="logo logo-lg" src="logo.svg" alt="" />
        <h2 class="empty-title">No reminders yet</h2>
        <p class="empty-text">
          Add one for anything you don't want to forget. It will ring at the time you choose.
        </p>
        <button id="empty-new-btn" class="pill-btn" type="button">
          <span class="plus" aria-hidden="true">+</span>
          <span>New reminder</span>
        </button>
        <p class="shortcut">or press <kbd>Ctrl</kbd>+<kbd>N</kbd></p>
      </section>
    </main>

    <!-- Only shown once there is at least one reminder -->
    <button id="new-btn" class="fab-float" type="button" title="New reminder (Ctrl+N)" aria-label="New reminder" hidden>
      <span class="plus" aria-hidden="true">+</span>
      <span>New reminder</span>
      <span class="kbd-group" aria-hidden="true"><kbd>Ctrl</kbd><kbd>N</kbd></span>
    </button>

    <div id="composer-backdrop" class="backdrop" hidden>
      <form
        id="composer"
        class="composer"
        role="dialog"
        aria-modal="true"
        aria-labelledby="composer-title"
        novalidate
      >
        <div class="composer-head">
          <h2 id="composer-title">New reminder</h2>
          <button type="button" id="close-btn" class="icon-btn" aria-label="Close">&times;</button>
        </div>

        <textarea
          id="note"
          rows="4"
          maxlength="280"
          placeholder="What do you need to remember?"
        ></textarea>

        <div class="field">
          <span>Date</span>
          <input type="date" id="date" required />
        </div>

        <div class="field">
          <span>Time</span>
          <div class="time-row">
            <select id="hour" aria-label="Hour"></select>
            <span class="colon">:</span>
            <select id="minute" aria-label="Minute"></select>
            <div class="meridiem" role="group" aria-label="AM or PM">
              <button type="button" data-meridiem="am" aria-pressed="true">AM</button>
              <button type="button" data-meridiem="pm" aria-pressed="false">PM</button>
            </div>
          </div>
        </div>

        <p id="clash-hint" class="warn-banner" hidden></p>
        <p id="composer-error" class="error-banner" hidden></p>

        <div class="composer-actions">
          <button type="button" id="cancel-btn" class="ghost">Cancel</button>
          <button type="submit" id="save-btn" class="primary">Save reminder</button>
        </div>
        <p class="hint">Ctrl+Enter to save · Esc to close</p>
      </form>
    </div>
  </body>
</html>
